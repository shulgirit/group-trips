name: CI

# Typecheck + tests for every workspace (backend/convex-test, i18n, shared, migrate, web, mobile).
# Deploys stay in deploy.yml / preview.yml; this only reports.
on:
  push:
    branches: [main, convex-web]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4          # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck test
