name: Event reminders

# Server-side "leaving soon" pushes for every trip in progress — no longer
# depends on someone having the app open. Needs CRON_SECRET set both as a
# repo secret and in Vercel env (production).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET not configured — skipping"
            exit 0
          fi
          curl -fsS -X POST \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            https://sicily-together.vercel.app/api/push/check-reminders
