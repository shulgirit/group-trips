name: Deploy to Vercel (production)

on:
  push:
    branches: [main]

# Never let two deploys race; later push wins after the current one finishes
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global vercel@latest
      # Build must happen ON Vercel (no --prebuilt): the NEXT_PUBLIC_* env
      # vars are flagged Sensitive and cannot be pulled outside Vercel — a
      # CI-side build bakes the literal string "[SENSITIVE]" into the
      # client bundle and breaks the Firebase connection.
      - name: Deploy (remote build on Vercel)
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
