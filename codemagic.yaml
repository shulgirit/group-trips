# Cloud builds for the store apps — no Mac needed (Codemagic ≈ Expo EAS
# Build + Submit). Setup steps: docs/native-apps.md → "Cloud builds".
#
# Codemagic UI, once:
#  - Teams → Integrations → App Store Connect: add an API key named "ASC"
#  - Code signing identities: upload the Android upload keystore
#    (reference name "together_upload") and let Codemagic fetch/create the
#    iOS distribution certificate + App Store profile for app.together.trips
#  - Environment variable groups:
#      firebase      → GOOGLE_SERVICE_INFO_PLIST, GOOGLE_SERVICES_JSON (base64)
#      google_play   → GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (Play API JSON)
workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: ASC
    environment:
      groups:
        - firebase
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.together.trips
      node: 22
      xcode: latest
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "app-v*"
    scripts:
      - name: Install
        script: npm ci
      - name: Firebase config
        script: echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/App/App/GoogleService-Info.plist
      - name: Sync native project
        script: npx cap sync ios
      - name: Code signing
        script: xcode-project use-profiles
      - name: Build number
        script: |
          cd ios/App
          agvtool new-version -all $(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0) + 1))
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-play:
    name: Android → Google Play (internal)
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      groups:
        - firebase
        - google_play
      android_signing:
        - together_upload
      node: 22
      java: 21
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "app-v*"
    scripts:
      - name: Install
        script: npm ci
      - name: Firebase config
        script: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
      - name: Sync native project
        script: npx cap sync android
      - name: Build AAB
        script: |
          export BUILD_NUMBER=$((PROJECT_BUILD_NUMBER + 100))
          cd android && ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
